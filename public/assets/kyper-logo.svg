<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBase" x1="14" y1="6" x2="106" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#181B2C" />
      <stop offset="0.4" stop-color="#0E121F" />
      <stop offset="1.0" stop-color="#06080F" />
    </linearGradient>

    <!-- Metallic Chamfer Rim Gradient -->
    <linearGradient id="rimGrad" x1="14" y1="6" x2="106" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#FFFFFF" />
      <stop offset="0.25" stop-color="#A78BFA" />
      <stop offset="0.55" stop-color="#8B5CF6" />
      <stop offset="0.8" stop-color="#06B6D4" />
      <stop offset="1.0" stop-color="#1E293B" />
    </linearGradient>

    <!-- Left Pillar (Stem) -->
    <linearGradient id="stemGrad" x1="36" y1="30" x2="48" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#FFFFFF" />
      <stop offset="0.4" stop-color="#E2E8F0" />
      <stop offset="0.8" stop-color="#A78BFA" />
      <stop offset="1.0" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Upper Wing -->
    <linearGradient id="upperWing" x1="48" y1="30" x2="88" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#FFFFFF" />
      <stop offset="0.4" stop-color="#C084FC" />
      <stop offset="0.8" stop-color="#8B5CF6" />
      <stop offset="1.0" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Lower Wing with 3D Depth -->
    <linearGradient id="lowerWing" x1="46" y1="54" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#8B5CF6" />
      <stop offset="0.45" stop-color="#6366F1" />
      <stop offset="0.8" stop-color="#06B6D4" />
      <stop offset="1.0" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Energy Glow Filter -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Glow for Shield -->
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Backlight -->
  <path d="M60,6 L106,28 L106,92 L60,114 L14,92 L14,28 Z" fill="none" stroke="rgba(139, 92, 246, 0.45)" stroke-width="6" filter="url(#shieldGlow)" opacity="0.6" />

  <!-- Outer Hex-Shield Base -->
  <path d="M60,6 L106,28 L106,92 L60,114 L14,92 L14,28 Z" fill="url(#shieldBase)" />

  <!-- Metallic Chamfer Border -->
  <path d="M60,6 L106,28 L106,92 L60,114 L14,92 L14,28 Z" fill="none" stroke="url(#rimGrad)" stroke-width="2.2" />

  <!-- Inner Shading Rim -->
  <path d="M60,14 L98,33 L98,87 L60,106 L22,87 L22,33 Z" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="0.9" />

  <!-- 3D Metallic Stem of K (Left Pillar) -->
  <path d="M36,30 L48,30 L48,90 L36,90 Z" fill="url(#stemGrad)" />

  <!-- Stem Left Light-Reflect Stripe -->
  <path d="M37,31 L39.5,31 L39.5,89 L37,89 Z" fill="#FFFFFF" opacity="0.5" />

  <!-- Upper Diagonal Wing of K -->
  <path d="M48,58 L75,30 L89,30 L59,61 Z" fill="url(#upperWing)" />

  <!-- Upper Wing Top Highlight Edge -->
  <path d="M75,30 L89,30 L59,61 L58,60 Z" fill="#FFFFFF" opacity="0.4" />

  <!-- Lower Diagonal Wing of K (3D Depth Facet) -->
  <path d="M54,54 L90,90 L75,90 L46,62 Z" fill="url(#lowerWing)" />

  <!-- Cyber Voltage Lightning Dart (KYPER Signature Precision Bolt) -->
  <path d="M60,34 L54,52 L62,50 L53,74 L69,48 L61,50 Z" fill="#38BDF8" opacity="0.9" filter="url(#coreGlow)" />

  <!-- Core Prism Diamond Highlight -->
  <path d="M48,52 L59,60 L48,68 Z" fill="#FFFFFF" />
  <circle cx="53" cy="60" r="1.5" fill="#06B6D4" />
</svg>
